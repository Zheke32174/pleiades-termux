name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Compile Python surfaces
        run: python3 -m py_compile bin/pleiades-edge.py ci/scan_public_repo.py scripts/write_spdx_sbom.py

      - name: Unit tests
        id: unit
        run: |
          set +e
          python3 -m unittest discover -s tests -v > unit-tests.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat unit-tests.log
          exit 0

      - name: Shell syntax and uninstall policy
        id: shell
        run: |
          set +e
          bash -n env/*.sh scripts/package_source.sh tests/test_uninstall.sh > shell-parse.log 2>&1
          parse_status=$?
          bash tests/test_uninstall.sh > uninstall-tests.log 2>&1
          test_status=$?
          echo "parse_status=$parse_status" >> "$GITHUB_OUTPUT"
          echo "test_status=$test_status" >> "$GITHUB_OUTPUT"
          cat shell-parse.log uninstall-tests.log
          exit 0

      - name: Edge boundary invariants
        id: boundary
        run: |
          set +e
          {
            ! grep -nE '^(systemctl|sudo|nsenter|machinectl|systemd-nspawn|pgrep)\(\)' env/pleiades-termux-lib.sh
            ! grep -nE 'root\.x86_64/scripts|for script in .*scripts|API_KEY|settings\.json' env/bootstrap-termux.sh
            grep -Fq 'authority": "none"' bin/pleiades-edge.py
            grep -Fq 'authority": "observation-only"' bin/pleiades-edge.py
            grep -Fq 'contiguous per-stream delivery sequences' README.md
            grep -Fq 'no automatic network transmission' README.md
            grep -Fq 'acknowledged high water remains zero' README.md
            grep -Fq 'receiver://unconfigured' bin/pleiades-edge.py
            grep -Fq 'requires --yes because it deletes queued events' env/uninstall-termux.sh
            ! find . -type f -not -path './.git/*' \( -name '*.key' -o -name '*.pem' -o -name '*.p12' -o -name '.env' \) -print -quit | grep -q .
          } > boundary.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat boundary.log
          exit 0

      - name: Capture public-tree and history scan
        if: always()
        id: sensitivity
        run: |
          set +e
          python3 ci/scan_public_repo.py > sensitivity.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat sensitivity.log
          exit 0

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pleiades-termux-validation-${{ github.sha }}
          path: |
            unit-tests.log
            shell-parse.log
            uninstall-tests.log
            boundary.log
            sensitivity.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce validation gate
        if: always()
        run: |
          test "${{ steps.unit.outputs.status }}" = "0"
          test "${{ steps.shell.outputs.parse_status }}" = "0"
          test "${{ steps.shell.outputs.test_status }}" = "0"
          test "${{ steps.boundary.outputs.status }}" = "0"
          test "${{ steps.sensitivity.outputs.status }}" = "0"
          test "$(cat VERSION)" = "0.2.0"

  source-package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Build twice and prove byte reproducibility
        run: |
          set -euo pipefail
          bash scripts/package_source.sh dist-one
          bash scripts/package_source.sh dist-two
          for first in dist-one/*; do
            file="$(basename "$first")"
            cmp "$first" "dist-two/$file"
          done

      - name: Verify archive matches the reviewed source manifest
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          ARCHIVE="dist-one/pleiades-termux-${VERSION}.tar.gz"
          sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' release/source-files.txt \
            | sed "s#^#pleiades-termux-${VERSION}/#" > expected-files.txt
          tar -tzf "$ARCHIVE" | grep -v '/$' | LC_ALL=C sort > actual-files.txt
          cmp expected-files.txt actual-files.txt
          ! grep -Eq '/scripts/(Taygete|Celaeno|Sterope|Alcyone|Asterope|Atlas|Merope|Maia|Electra)\.sh$' actual-files.txt

      - name: Verify checksum manifest
        run: |
          cd dist-one
          sha256sum -c SHA256SUMS.txt

      - name: Upload exact-head source candidate
        uses: actions/upload-artifact@v4
        with:
          name: pleiades-termux-source-${{ github.sha }}
          path: dist-one/
          if-no-files-found: error
          retention-days: 30
