name: source release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: source-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - name: Validate immutable version identity and ancestry
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "::error::Tagged commit is not reachable from main"
            exit 1
          }

      - name: Validate implementation and public history
        run: |
          python3 -m py_compile bin/pleiades-edge.py ci/scan_public_repo.py scripts/write_spdx_sbom.py
          python3 -m unittest discover -s tests -v
          bash -n env/*.sh scripts/package_source.sh tests/test_uninstall.sh
          bash tests/test_uninstall.sh
          python3 ci/scan_public_repo.py

      - name: Build and verify source assets
        run: |
          bash scripts/package_source.sh dist
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Write download-first release notes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          archive = f"pleiades-termux-{version}.tar.gz"
          notes = f"""# Pleiades Termux Edge {version}

## Download

**Download `{archive}` from the Assets section below.**

This is the source distribution for the observation-only Android/Termux edge runtime. It does not contain an APK, Android app package, server swarm, container image, credentials, queue data, or automatic upstream transport.

Also download:

- `SHA256SUMS.txt` to verify every asset;
- `pleiades-termux-{version}.spdx.json` for the SPDX 2.3 source inventory;
- `pleiades-termux-{version}.build-receipt.json` for the exact commit and package hashes.

Extract inside Termux, verify the checksum manifest, then run `bash env/bootstrap-termux.sh --dry-run` before installation. Local queued observations are retained until the operator explicitly exports or purges them.
"""
          Path("dist/RELEASE-NOTES.md").write_text(notes, encoding="utf-8")
          PY

      - name: Refuse release overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists"
            exit 1
          fi

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.spdx.json \
            dist/*.build-receipt.json \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Pleiades Termux Edge ${GITHUB_REF_NAME#v}" \
            --notes-file dist/RELEASE-NOTES.md \
            --verify-tag
