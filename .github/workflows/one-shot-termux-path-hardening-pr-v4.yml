name: Finalize reviewed Termux path hardening

on:
  pull_request:
    branches:
      - hardening/public-release-readiness-v1

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'hardening/delivery-stream-continuity-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/delivery-stream-continuity-v1
          fetch-depth: 0
          show-progress: false
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/one-shot-termux-path-hardening.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          program = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          program = program.replace('if count != 1:', 'if count < 1:')
          Path('/tmp/apply.py').write_text(program, encoding='utf-8')
          PY
          python3 /tmp/apply.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/test_edge_path_safety.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"sentinel\n"', '"sentinel\\n"')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bin/pleiades-edge.py tests/test_edge_path_safety.py
          python3 -m unittest discover -s tests -v
          bash -n env/*.sh scripts/package_source.sh tests/test_uninstall.sh
          bash tests/test_uninstall.sh
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pleiades Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add bin/pleiades-edge.py tests/test_edge_path_safety.py
          git rm .github/workflows/one-shot-termux-path-hardening.yml
          git rm .github/workflows/one-shot-termux-path-hardening-pr.yml
          git rm .github/workflows/one-shot-termux-path-hardening-pr-v2.yml
          git rm .github/workflows/one-shot-termux-path-hardening-debug.yml
          git rm .github/workflows/one-shot-termux-path-hardening-pr-v4.yml
          git commit -m 'fix: refuse symlinked Termux state and lock paths'
          git push origin HEAD:hardening/delivery-stream-continuity-v1
