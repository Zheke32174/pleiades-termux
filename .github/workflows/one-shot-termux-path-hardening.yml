name: One-shot Termux state-path hardening

on:
  push:
    branches:
      - hardening/delivery-stream-continuity-v1
    paths:
      - .github/workflows/one-shot-termux-path-hardening.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/delivery-stream-continuity-v1
          fetch-depth: 0
          show-progress: false

      - name: Apply confined no-follow state handling
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          runtime = Path("bin/pleiades-edge.py")
          text = runtime.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one runtime match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              'MAX_EVENT_BYTES = 1024 * 1024\n',
              'MAX_EVENT_BYTES = 1024 * 1024\nLIVE_PATH_KEYS = ("root", "config", "state", "queue")\n',
          )

          replace_once(
              '''def root_path() -> pathlib.Path:
              return pathlib.Path(
                  os.environ.get(
                      "PLEIADES_ROOT",
                      pathlib.Path.home() / ".local" / "share" / "pleiades-edge",
                  )
              ).expanduser()


          def paths() -> dict[str, pathlib.Path]:
              root = root_path()
              return {
                  "root": root,
                  "config": pathlib.Path(
                      os.environ.get("PLEIADES_CONFIG", root / "config")
                  ).expanduser(),
                  "state": pathlib.Path(
                      os.environ.get("PLEIADES_STATE", root / "state")
                  ).expanduser(),
                  "queue": pathlib.Path(
                      os.environ.get("PLEIADES_QUEUE", root / "queue")
                  ).expanduser(),
                  "exports": pathlib.Path(
                      os.environ.get("PLEIADES_EXPORTS", root / "exports")
                  ).expanduser(),
              }


          def ensure_private_directory(path: pathlib.Path) -> None:
              path.mkdir(parents=True, exist_ok=True, mode=0o700)
              try:
                  path.chmod(0o700)
              except OSError:
                  pass
          ''',
              '''def lexical_absolute(path: pathlib.Path) -> pathlib.Path:
              return pathlib.Path(os.path.abspath(os.fspath(path.expanduser())))


          def root_path() -> pathlib.Path:
              return lexical_absolute(
                  pathlib.Path(
                      os.environ.get(
                          "PLEIADES_ROOT",
                          pathlib.Path.home() / ".local" / "share" / "pleiades-edge",
                      )
                  )
              )


          def paths() -> dict[str, pathlib.Path]:
              root = root_path()
              layout = {
                  "root": root,
                  "config": lexical_absolute(
                      pathlib.Path(os.environ.get("PLEIADES_CONFIG", root / "config"))
                  ),
                  "state": lexical_absolute(
                      pathlib.Path(os.environ.get("PLEIADES_STATE", root / "state"))
                  ),
                  "queue": lexical_absolute(
                      pathlib.Path(os.environ.get("PLEIADES_QUEUE", root / "queue"))
                  ),
                  "exports": lexical_absolute(
                      pathlib.Path(os.environ.get("PLEIADES_EXPORTS", root / "exports"))
                  ),
              }
              for key in ("config", "state", "queue"):
                  try:
                      layout[key].relative_to(root)
                  except ValueError as exc:
                      raise EdgeError(
                          f"{key} path must remain within PLEIADES_ROOT: {layout[key]}"
                      ) from exc
              return layout


          def _lstat(path: pathlib.Path) -> os.stat_result | None:
              try:
                  return path.lstat()
              except FileNotFoundError:
                  return None
              except OSError as exc:
                  raise EdgeError(f"cannot inspect path {path}: {exc}") from exc


          def _assert_no_symlink_components(path: pathlib.Path) -> None:
              absolute = lexical_absolute(path)
              current = pathlib.Path(absolute.anchor)
              for part in absolute.parts[1:]:
                  current /= part
                  observed = _lstat(current)
                  if observed is not None and stat.S_ISLNK(observed.st_mode):
                      raise EdgeError(f"symlink path component refused: {current}")


          def _validate_directory(path: pathlib.Path, *, require_owner: bool) -> None:
              observed = _lstat(path)
              if observed is None:
                  raise EdgeError(f"managed directory is missing: {path}")
              if stat.S_ISLNK(observed.st_mode):
                  raise EdgeError(f"symlink directory refused: {path}")
              if not stat.S_ISDIR(observed.st_mode):
                  raise EdgeError(f"managed path is not a directory: {path}")
              if require_owner and hasattr(os, "geteuid") and observed.st_uid != os.geteuid():
                  raise EdgeError(f"managed directory is not owned by the current user: {path}")


          def ensure_private_directory(
              path: pathlib.Path, *, require_owner: bool = True
          ) -> None:
              path = lexical_absolute(path)
              _assert_no_symlink_components(path)
              try:
                  path.mkdir(parents=True, exist_ok=True, mode=0o700)
              except OSError as exc:
                  raise EdgeError(f"cannot create managed directory {path}: {exc}") from exc
              _assert_no_symlink_components(path)
              _validate_directory(path, require_owner=require_owner)
              try:
                  path.chmod(0o700)
              except OSError as exc:
                  raise EdgeError(f"cannot secure managed directory {path}: {exc}") from exc
              _validate_directory(path, require_owner=require_owner)


          def verify_live_layout(layout: dict[str, pathlib.Path]) -> None:
              for key in LIVE_PATH_KEYS:
                  ensure_private_directory(layout[key])
          ''',
          )

          replace_once(
              '''@contextlib.contextmanager
          def file_lock(path: pathlib.Path, *, shared: bool = False) -> Iterator[None]:
              ensure_private_directory(path.parent)
              fd = os.open(path, os.O_CREAT | os.O_RDWR, 0o600)
              try:
                  fcntl.flock(fd, fcntl.LOCK_SH if shared else fcntl.LOCK_EX)
                  yield
              finally:
                  fcntl.flock(fd, fcntl.LOCK_UN)
                  os.close(fd)
          ''',
              '''def _require_regular_file(path: pathlib.Path) -> os.stat_result:
              observed = _lstat(path)
              if observed is None:
                  raise EdgeError(f"managed file is missing: {path}")
              if stat.S_ISLNK(observed.st_mode):
                  raise EdgeError(f"symlink file refused: {path}")
              if not stat.S_ISREG(observed.st_mode):
                  raise EdgeError(f"managed path is not a regular file: {path}")
              return observed


          def _open_regular_fd(path: pathlib.Path, flags: int, mode: int = 0o600) -> int:
              before = _lstat(path)
              if before is not None and stat.S_ISLNK(before.st_mode):
                  raise EdgeError(f"symlink file refused: {path}")
              safe_flags = flags | getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0)
              try:
                  fd = os.open(path, safe_flags, mode)
              except OSError as exc:
                  raise EdgeError(f"cannot open managed file {path}: {exc}") from exc
              try:
                  opened = os.fstat(fd)
                  if not stat.S_ISREG(opened.st_mode):
                      raise EdgeError(f"managed path is not a regular file: {path}")
                  if hasattr(os, "geteuid") and opened.st_uid != os.geteuid():
                      raise EdgeError(f"managed file is not owned by the current user: {path}")
                  linked = _require_regular_file(path)
                  if (opened.st_dev, opened.st_ino) != (linked.st_dev, linked.st_ino):
                      raise EdgeError(f"managed file identity changed while opening: {path}")
                  return fd
              except BaseException:
                  os.close(fd)
                  raise


          @contextlib.contextmanager
          def file_lock(path: pathlib.Path, *, shared: bool = False) -> Iterator[None]:
              ensure_private_directory(path.parent)
              fd = _open_regular_fd(path, os.O_CREAT | os.O_RDWR, 0o600)
              try:
                  fcntl.flock(fd, fcntl.LOCK_SH if shared else fcntl.LOCK_EX)
                  ensure_private_directory(path.parent)
                  opened = os.fstat(fd)
                  linked = _require_regular_file(path)
                  if (opened.st_dev, opened.st_ino) != (linked.st_dev, linked.st_ino):
                      raise EdgeError(f"lock file identity changed while acquiring: {path}")
                  yield
              finally:
                  fcntl.flock(fd, fcntl.LOCK_UN)
                  os.close(fd)
          ''',
          )

          replace_once(
              '    fd = os.open(temporary, os.O_CREAT | os.O_EXCL | os.O_WRONLY, mode)\n',
              '    fd = _open_regular_fd(temporary, os.O_CREAT | os.O_EXCL | os.O_WRONLY, mode)\n',
          )
          replace_once(
              '    os.replace(temporary, path)\n    try:\n        path.chmod(mode)\n',
              '    ensure_private_directory(path.parent)\n    existing = _lstat(path)\n    if existing is not None and stat.S_ISLNK(existing.st_mode):\n        temporary.unlink(missing_ok=True)\n        raise EdgeError(f"symlink destination refused: {path}")\n    os.replace(temporary, path)\n    try:\n        path.chmod(mode)\n',
          )
          replace_once(
              '''def load_json(path: pathlib.Path) -> dict[str, Any]:
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
          ''',
              '''def load_json(path: pathlib.Path) -> dict[str, Any]:
              _require_regular_file(path)
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
          ''',
          )
          replace_once(
              '    try:\n        with queue_path.open("r", encoding="utf-8", errors="strict") as handle:\n',
              '    try:\n        _require_regular_file(queue_path)\n        with queue_path.open("r", encoding="utf-8", errors="strict") as handle:\n',
          )
          replace_once(
              '    try:\n        with queue_path.open("rb") as handle:\n',
              '    try:\n        _require_regular_file(queue_path)\n        with queue_path.open("rb") as handle:\n',
          )
          replace_once(
              '''    for key in ("root", "config", "state", "queue", "exports"):
                  ensure_private_directory(layout[key])

              with file_lock(layout["state"] / "initialize.lock"):
          ''',
              '''    verify_live_layout(layout)
              ensure_private_directory(layout["exports"], require_owner=False)

              with file_lock(layout["state"] / "initialize.lock"):
                  verify_live_layout(layout)
          ''',
          )
          replace_once(
              '        with file_lock(layout["state"] / "queue.lock"):\n            reconcile_delivery_state(node, layout)\n',
              '        with file_lock(layout["state"] / "queue.lock"):\n            verify_live_layout(layout)\n            reconcile_delivery_state(node, layout)\n',
          )
          replace_once(
              '    with file_lock(layout["state"] / "queue.lock", shared=True):\n        delivery = load_json(layout["state"] / "delivery-stream.json")\n',
              '    with file_lock(layout["state"] / "queue.lock", shared=True):\n        verify_live_layout(layout)\n        delivery = load_json(layout["state"] / "delivery-stream.json")\n',
          )
          replace_once(
              '    with file_lock(layout["state"] / "queue.lock"):\n        current = max(\n',
              '    with file_lock(layout["state"] / "queue.lock"):\n        verify_live_layout(layout)\n        current = max(\n',
          )
          replace_once(
              '        fd = os.open(queue_path, os.O_APPEND | os.O_WRONLY)\n',
              '        fd = _open_regular_fd(queue_path, os.O_APPEND | os.O_WRONLY)\n',
          )
          replace_once(
              '''    with file_lock(layout["state"] / "queue.lock", shared=True):
                  delivery = load_json(layout["state"] / "delivery-stream.json")
                  validate_delivery_state(delivery, node)
                  try:
                      lines = queue_path.read_text(
          ''',
              '''    with file_lock(layout["state"] / "queue.lock", shared=True):
                  verify_live_layout(layout)
                  delivery = load_json(layout["state"] / "delivery-stream.json")
                  validate_delivery_state(delivery, node)
                  _require_regular_file(queue_path)
                  try:
                      lines = queue_path.read_text(
          ''',
          )
          replace_once(
              '    atomic_json(layout["state"] / "status.json", status)\n    return status\n',
              '    with file_lock(layout["state"] / "status.lock"):\n        verify_live_layout(layout)\n        atomic_json(layout["state"] / "status.json", status)\n    return status\n',
          )
          replace_once(
              '''    if destination.is_dir():
                  destination = destination / f"pleiades-edge-{int(time.time())}.jsonl"
              destination = destination.expanduser()
              if destination.resolve() == source.resolve():
                  raise EdgeError("export destination must differ from the live queue")
              ensure_private_directory(destination.parent)
          ''',
              '''    if destination.is_dir():
                  destination = destination / f"pleiades-edge-{int(time.time())}.jsonl"
              destination = lexical_absolute(destination.expanduser())
              if destination == source:
                  raise EdgeError("export destination must differ from the live queue")
              ensure_private_directory(destination.parent, require_owner=False)
          ''',
          )
          replace_once(
              '''    with file_lock(layout["state"] / "queue.lock", shared=True):
                  try:
                      with source.open("rb") as reader, temporary.open("xb") as writer:
                          shutil.copyfileobj(reader, writer)
                          writer.flush()
                          os.fsync(writer.fileno())
                      temporary.chmod(0o600)
                      os.replace(temporary, destination)
                      fsync_directory(destination.parent)
          ''',
              '''    with file_lock(layout["state"] / "queue.lock", shared=True):
                  verify_live_layout(layout)
                  ensure_private_directory(destination.parent, require_owner=False)
                  try:
                      reader_fd = _open_regular_fd(source, os.O_RDONLY)
                      writer_fd = _open_regular_fd(
                          temporary, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600
                      )
                      with os.fdopen(reader_fd, "rb") as reader, os.fdopen(
                          writer_fd, "wb"
                      ) as writer:
                          shutil.copyfileobj(reader, writer)
                          writer.flush()
                          os.fsync(writer.fileno())
                      existing = _lstat(destination)
                      if existing is not None and stat.S_ISLNK(existing.st_mode):
                          raise EdgeError(f"symlink export destination refused: {destination}")
                      os.replace(temporary, destination)
                      fsync_directory(destination.parent)
          ''',
          )
          replace_once(
              'def permission_string(path: pathlib.Path) -> str:\n    return oct(stat.S_IMODE(path.stat().st_mode)) if path.exists() else "missing"\n',
              'def permission_string(path: pathlib.Path) -> str:\n    observed = _lstat(path)\n    if observed is None:\n        return "missing"\n    if stat.S_ISLNK(observed.st_mode):\n        return "unsafe-symlink"\n    return oct(stat.S_IMODE(observed.st_mode))\n',
          )

          runtime.write_text(text, encoding="utf-8")

          Path("tests/test_edge_path_safety.py").write_text(
              '''from __future__ import annotations

          import contextlib
          import importlib.util
          import os
          import pathlib
          import tempfile
          import unittest

          RUNTIME = pathlib.Path(__file__).resolve().parents[1] / "bin" / "pleiades-edge.py"
          SPEC = importlib.util.spec_from_file_location("pleiades_edge_path_safety", RUNTIME)
          assert SPEC and SPEC.loader
          edge = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(edge)

          ENV_KEYS = (
              "PLEIADES_ROOT",
              "PLEIADES_CONFIG",
              "PLEIADES_STATE",
              "PLEIADES_QUEUE",
              "PLEIADES_EXPORTS",
          )


          @contextlib.contextmanager
          def isolated_layout(root: pathlib.Path, **overrides: pathlib.Path):
              previous = {key: os.environ.get(key) for key in ENV_KEYS}
              try:
                  for key in ENV_KEYS:
                      os.environ.pop(key, None)
                  os.environ["PLEIADES_ROOT"] = str(root)
                  for key, value in overrides.items():
                      os.environ[key] = str(value)
                  yield
              finally:
                  for key in ENV_KEYS:
                      os.environ.pop(key, None)
                  for key, value in previous.items():
                      if value is not None:
                          os.environ[key] = value


          class EdgePathSafetyTests(unittest.TestCase):
              def test_symlink_root_is_refused_before_initialization(self) -> None:
                  with tempfile.TemporaryDirectory() as temporary:
                      base = pathlib.Path(temporary)
                      real = base / "real"
                      real.mkdir()
                      linked = base / "linked"
                      linked.symlink_to(real, target_is_directory=True)
                      with isolated_layout(linked):
                          with self.assertRaisesRegex(edge.EdgeError, "symlink"):
                              edge.initialize()

              def test_live_state_overrides_must_remain_inside_root(self) -> None:
                  with tempfile.TemporaryDirectory() as temporary:
                      base = pathlib.Path(temporary)
                      root = base / "root"
                      outside = base / "outside"
                      with isolated_layout(root, PLEIADES_STATE=outside):
                          with self.assertRaisesRegex(
                              edge.EdgeError, "state path must remain within PLEIADES_ROOT"
                          ):
                              edge.paths()

              def test_symlink_lock_file_is_refused(self) -> None:
                  with tempfile.TemporaryDirectory() as temporary:
                      base = pathlib.Path(temporary)
                      root = base / "root"
                      with isolated_layout(root):
                          edge.initialize()
                          layout = edge.paths()
                          lock = layout["state"] / "hostile.lock"
                          target = base / "target"
                          target.write_text("untouched", encoding="utf-8")
                          lock.symlink_to(target)
                          with self.assertRaisesRegex(edge.EdgeError, "symlink"):
                              with edge.file_lock(lock):
                                  self.fail("symlink lock unexpectedly acquired")
                          self.assertEqual(target.read_text(encoding="utf-8"), "untouched")

              def test_symlink_queue_is_refused_without_touching_target(self) -> None:
                  with tempfile.TemporaryDirectory() as temporary:
                      base = pathlib.Path(temporary)
                      root = base / "root"
                      with isolated_layout(root):
                          edge.initialize()
                          layout = edge.paths()
                          queue = layout["queue"] / "events.jsonl"
                          queue.unlink()
                          target = base / "target.jsonl"
                          target.write_text("sentinel\n", encoding="utf-8")
                          queue.symlink_to(target)
                          with self.assertRaisesRegex(edge.EdgeError, "symlink"):
                              edge.emit("test.path-safety", "info", "unit-test", {})
                          self.assertEqual(target.read_text(encoding="utf-8"), "sentinel\n")

              def test_export_destination_may_be_outside_live_root(self) -> None:
                  with tempfile.TemporaryDirectory() as temporary:
                      base = pathlib.Path(temporary)
                      root = base / "root"
                      export_dir = base / "operator-selected-export"
                      with isolated_layout(root):
                          edge.initialize()
                          edge.emit("test.export", "info", "unit-test", {"ok": True})
                          destination = edge.export_queue(export_dir / "events.jsonl")
                          self.assertEqual(destination, export_dir / "events.jsonl")
                          self.assertIn("test.export", destination.read_text(encoding="utf-8"))


          if __name__ == "__main__":
              unittest.main()
          ''',
              encoding="utf-8",
          )
          PY

      - name: Verify patched runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bin/pleiades-edge.py tests/test_edge_path_safety.py
          python3 -m unittest discover -s tests -v

      - name: Commit verified repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Pleiades Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add bin/pleiades-edge.py tests/test_edge_path_safety.py
          git rm .github/workflows/one-shot-termux-path-hardening.yml
          git commit -m "fix: refuse symlinked Termux state and lock paths"
          git push origin HEAD:hardening/delivery-stream-continuity-v1
