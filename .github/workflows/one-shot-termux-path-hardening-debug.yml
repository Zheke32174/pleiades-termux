name: Diagnose reviewed Termux path hardening

on:
  pull_request:
    branches:
      - hardening/public-release-readiness-v1

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'hardening/delivery-stream-continuity-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/delivery-stream-continuity-v1
          fetch-depth: 0
          show-progress: false
      - name: Apply reviewed patch in workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/one-shot-termux-path-hardening.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          program = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          program = program.replace('if count != 1:', 'if count < 1:')
          Path('/tmp/apply.py').write_text(program, encoding='utf-8')
          PY
          python3 /tmp/apply.py
      - name: Capture verification diagnostics
        id: verify
        shell: bash
        run: |
          set +e
          : > verify.log
          python3 -m py_compile bin/pleiades-edge.py tests/test_edge_path_safety.py >> verify.log 2>&1
          compile_rc=$?
          python3 -m unittest discover -s tests -v >> verify.log 2>&1
          unit_rc=$?
          bash -n env/*.sh scripts/package_source.sh tests/test_uninstall.sh >> verify.log 2>&1
          shell_rc=$?
          bash tests/test_uninstall.sh >> verify.log 2>&1
          uninstall_rc=$?
          printf '\ncompile_rc=%s\nunit_rc=%s\nshell_rc=%s\nuninstall_rc=%s\n' "$compile_rc" "$unit_rc" "$shell_rc" "$uninstall_rc" >> verify.log
          cat verify.log
          echo "status=$((compile_rc || unit_rc || shell_rc || uninstall_rc))" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termux-path-hardening-diagnostics-${{ github.sha }}
          path: verify.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce diagnostic result
        if: always()
        shell: bash
        run: test "${{ steps.verify.outputs.status }}" = "0"
